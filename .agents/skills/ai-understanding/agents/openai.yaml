interface:
  display_name: "Export Understandings"
  short_description: "Distil a session into Understandings on disk; import, publish and consume them"
  default_prompt: "Export this session as Understandings: read the whole session, split it into one unit per question, and write each to .context/understandings/<subject>-<yyyyMMdd-HHmm>/<slug>.md — the stamped subject folder groups the session, one file per Understanding. Read .context/understandings/INDEX.md FIRST, before proposing anything, and classify each candidate against it: nothing in the index is new; a current unit whose question yours would answer and that this session did not change is already known, so write nothing for it; one this session refined is improved, so reuse its slug and write the complete improved unit; a current slug answering a genuinely different question gets a disambiguated slug. Judge same question generously — a narrower question is the same question asked later, and the qualifier that makes yours feel new belongs in the answer, not a new slug; when unsure prefer improved. Then create ONE new stamped folder for this run (current UTC time) holding only what this run produced — never write into a folder an earlier run created, never copy an unchanged unit forward, and create no folder at all if nothing is written. An improved unit carries provenance.supersedes with the previous folder name; previous copies are never edited or deleted. Each must stand alone for an agent with zero context from this session: no 'as established above'. Frontmatter carries slug (matching the filename; the same slug in two stamped folders is a version chain, newest current — not an error), description, question (omit on an outcome record), scope (portable only if true outside this repo, else repo-specific), confidence (observed unless reproduced), agents_context, and provenance including any [[slugs]] this session inherited and acted on, as block-list entries. Body is Answer, Why in 1-3 lines, and Boundaries. Write as evidence, never orders — anything needing must/never language is a rule, not an Understanding, so propose it as one instead. Never edit, overwrite or delete an existing copy of a slug: an improvement is a new complete copy under the same slug in this run's folder, and a different question gets a different slug. Mark a unit verified only if EVERY claim in it was checked — one inferred or 'probably' line makes the whole unit observed. Quote evidence inline; no secrets, since these are publishable. List the candidate slugs with their questions AND their outcome (new / already known / improved / new (disambiguated)) for me to cut before writing anything, unless I passed --all. Report every candidate under one of those four — a silent skip is indistinguishable from a missed export — and say plainly when a run wrote nothing, which is a correct outcome rather than a failure. Afterwards regenerate the index with scripts/understanding_index.py and report any problems it prints."
  model: gpt-5.5
