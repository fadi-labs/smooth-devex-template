  # --- MEDIUM: --autonomous opt-in autonomy phrasing (git skills + index) ---
  - id: EA2
    file: README.md
    reason: >-
      "Autonomous Decision Making" — describes the opt-in `--autonomous` switch (suppress
      questions) and the agent fleet model. git-policy already forbids any commit/push
      without explicit user instruction; nothing destructive runs unprompted.
  - id: EA2
    file: git-commit/SKILL.md
    reason: >-
      "without asking" documents the `--autonomous` flag. The skill never commits unless
      the user explicitly invokes it (git-policy). Removing it breaks the documented UX.
  - id: EA2
    file: git-commit-push/SKILL.md
    reason: >-
      "without asking" documents `--autonomous`. Push happens only on explicit user
      request per git-policy.
  - id: EA2
    file: git-commit-push-pr/SKILL.md
    reason: >-
