# SkillSpector accepted-findings baseline
# ----------------------------------------
# Findings listed here are SUPPRESSED FROM THE GATE DECISION but still reported in
# the "Accepted (baselined)" section of the job summary. The gate
# (.github/scripts/skillspector-report.py) fails on any ACTIVE (non-baselined)
# finding, so a genuinely new dangerous pattern — real secret exfiltration, hidden
# instructions, supply-chain — still blocks the PR.
#
# Match key: (id, file). LINE-AGNOSTIC by design — every occurrence of that finding
# id in that file is accepted. This survives the line drift the upstream pin warns
# about. A NEW id, or the same id in a NEW file, is NOT baselined and blocks the gate.
#
# Every entry MUST carry a `reason`. These are first-party agent-tooling findings:
# "true-by-pattern but expected-for-context" — the flagged behavior IS the skill's
# function (or is benign documentation), and removing it would break the skill.
# Re-review this list whenever SKILLSPECTOR_REF is bumped (finding ids/lines may move).
#
# SCOPE: this baseline gates the DETERMINISTIC STATIC scan only (the workflow runs the
# gating scan with --no-llm; policy A). The LLM semantic stage runs advisory/non-blocking
# and is NOT gated by this file, so its nondeterministic findings are intentionally absent
# here — they are reported in the job summary for human review. See .agents/skills/AGENTS.md.
#
# NOTE: No real secret leakage exists in any skill today. The standing guardrail for
# any future secret handling is .github/instructions/skills/skill-secret-handling.instructions.md.

accepted:
  # --- HIGH: subprocess wrappers that MUST shell out to gh/git ---
  - id: OH1
    file: agile-github-breakdown/scripts/create_github_breakdown.py
    reason: >-
      "Unvalidated Output Injection" on subprocess.run wrappers. Inputs are CLI flags
      and git/gh output passed as a list (shell=False) — no shell, SQL, or HTML sink,
      so there is no injection path. Calling gh/git is the skill's entire purpose;
      removing subprocess breaks it. Hardened with an explicit shell=False comment.
  - id: OH1
    file: agile-github-task-from-diff/scripts/create_github_task_from_diff.py
    reason: >-
      "Unvalidated Output Injection" on subprocess.run wrappers. Inputs are CLI flags
      and git/gh output passed as a list (shell=False) — no shell, SQL, or HTML sink,
      so there is no injection path. Calling gh/git is the skill's entire purpose;
      removing subprocess breaks it. Hardened with an explicit shell=False comment.

  # --- HIGH: ai-asset-sync OpenCode CLI installer (curl | bash) ---
  - id: SC2
    file: ai-asset-sync/scripts/lib/install-opencode.sh
    reason: >-
      "External Script Fetching" / curl|bash on the official OpenCode installer
      (`curl -fsSL https://opencode.ai/install | bash`) — previously flagged
      TM1 "Tool Parameter Abuse"; the pinned SkillSpector now categorizes it
      SC2. Same install contract as smooth-ai-report-review LADR-048: a single
      lib honours OPENCODE_CLI_VERSION, verifies the binary, and refuses a
      version mismatch. The URL is fixed, not user-controlled. Removing the
      pipe breaks CI OpenCode install.

  # --- HIGH: ai-asset-sync parse_manifest negative-path test asserting /etc/passwd rejection ---
  - id: PE3
    file: ai-asset-sync/scripts/lib/test_parse_manifest.py
    reason: >-
      "Credential Access" on the literal `/etc/passwd` in `test_rejects_absolute`
      — a unit test asserting `parse_source` REJECTS an absolute-path source.
      The string is a hostile negative test case that is parsed and refused; no
      credential is read, written, or exfiltrated. Removing it weakens the
      injection-surface test.

  # --- HIGH: ai-asset-sync entrypoint replace-then-copy chain ---
  - id: TM2
    file: ai-asset-sync/scripts/run-sync.sh
    reason: >-
      "Chaining Abuse" on the resolve→fetch→replace(`rm -rf`)→copy chain in the
      overwrite/absent-local path. Replacing the local asset with the upstream
      snapshot IS the sync's function (type-change-safe overwrite, added for
      PR #66 review). The target path is constrained: strict manifest charset
      validation (no `..`, no `.`/`.git`/workflow destinations, no absolute/`~`
      paths), symlink-physical resolution that dies outside the repo root, and
      a pre-flight clean-tree guard so only committed (git-recoverable) state
      is ever replaced. Removing the rm reintroduces the file↔directory
      type-change bug.

  # --- HIGH: ai-template-sync rm of the rules symlink + instructions refresh ---
  - id: TM1
    file: ai-template-sync/scripts/sync.sh
    reason: >-
      "Tool Parameter Abuse" on `rm -f .agents/rules` / `rm -rf .github/instructions`.
      Replacing the .agents/rules symlink and refreshing .github/instructions (in
      --overwrite global) IS the sync's core function. Guarded by pre-flight checks
      that refuse to delete a real directory (exit 65); paths are fixed, not
      user-controlled. Removing the rm breaks template sync.
  - id: TM1
    file: ai-template-sync/SKILL.md
    reason: >-
      The literal rm commands appear inside SAFETY-WARNING documentation explaining
      the destructive sync step and the pre-flight guard against it. The text is the
      safeguard; deleting it removes the safety documentation. Not an executed command.

  # --- MEDIUM: subprocess module presence (same lines as OH1) ---
  - id: AST4
    file: agile-github-breakdown/scripts/create_github_breakdown.py
    reason: >-
      "subprocess module call" — same wrappers as OH1. subprocess is required to invoke
